name: Python CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test and lint dependencies
        run: python -m pip install flake8 pytest
      - name: Lint with Flake8
        run: flake8 .
      - name: Run unit tests
        run: pytest -q
